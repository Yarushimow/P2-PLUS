"c-ok"/><line x1="138.2" y1="68.7" x2="145.7" y2="45.5" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M147.4 40.1 L148.3 47.8 L142.3 45.8 Z" fill="currentColor" class="c-ok"/><line x1="175.7" y1="95.9" x2="195.4" y2="81.6" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M199.9 78.3 L196.1 84.9 L192.4 79.8 Z" fill="currentColor" class="c-ok"/><text x="115" y="145" font-size="12" text-anchor="middle" fill="currentColor" class="c-pos">boule</text><text x="115" y="272" font-size="13.5" text-anchor="middle" font-weight="700" fill="currentColor">Sphère : Φ = <tspan font-style="italic">E</tspan>·4π<tspan font-style="italic">r</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text><line x1="345" y1="30" x2="345" y2="245" stroke="currentColor" stroke-width="3" class="c-pos"/><text x="351" y="28" font-size="12.5" text-anchor="start" fill="currentColor" class="c-pos">fil (<tspan font-style="italic">λ</tspan>)</text><ellipse cx="345" cy="70" rx="52" ry="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 5" class="c-acc"/><path d="M293 205 A52 14 0 0 0 397 205" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round" class="c-acc"/><path d="M293 205 A52 14 0 0 1 397 205" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" stroke-linejoin="round" stroke-linecap="round" class="c-acc"/><line x1="293" y1="70" x2="293" y2="205" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 5" class="c-acc"/><line x1="397" y1="70" x2="397" y2="205" stroke="currentColor" stroke-width="1.8" stroke-dasharray="6 5" class="c-acc"/><line x1="397" y1="105" x2="429.4" y2="105" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M435 105 L428 108.2 L428 101.8 Z" fill="currentColor" class="c-ok"/><line x1="293" y1="105" x2="260.6" y2="105" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M255 105 L262 101.8 L262 108.2 Z" fill="currentColor" class="c-ok"/><line x1="397" y1="140" x2="429.4" y2="140" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M435 140 L428 143.2 L428 136.8 Z" fill="currentColor" class="c-ok"/><line x1="293" y1="140" x2="260.6" y2="140" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M255 140 L262 136.8 L262 143.2 Z" fill="currentColor" class="c-ok"/><line x1="397" y1="175" x2="429.4" y2="175" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M435 175 L428 178.2 L428 171.8 Z" fill="currentColor" class="c-ok"/><line x1="293" y1="175" x2="260.6" y2="175" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M255 175 L262 171.8 L262 178.2 Z" fill="currentColor" class="c-ok"/><text x="403" y="64" font-size="11.5" text-anchor="start" fill="currentColor" class="c-mut">Φ = 0 (base)</text><text x="345" y="272" font-size="13.5" text-anchor="middle" font-weight="700" fill="currentColor">Cylindre : Φ = <tspan font-style="italic">E</tspan>·2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text><path d="M480 162 L540 122 L670 122 L610 162 Z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" class="c-pos"/><text x="663" y="116" font-size="12.5" text-anchor="end" fill="currentColor" class="c-pos">plan (<tspan font-style="italic">σ</tspan>)</text><ellipse cx="575" cy="98" rx="26" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4" class="c-acc"/><ellipse cx="575" cy="202" rx="26" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4" class="c-acc"/><line x1="549" y1="98" x2="549" y2="202" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4" class="c-acc"/><line x1="601" y1="98" x2="601" y2="202" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4" class="c-acc"/><line x1="563" y1="98" x2="563" y2="61.6" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M563 56 L566.1 63 L559.9 63 Z" fill="currentColor" class="c-ok"/><line x1="563" y1="202" x2="563" y2="238.4" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M563 244 L559.9 237 L566.1 237 Z" fill="currentColor" class="c-ok"/><line x1="587" y1="98" x2="587" y2="61.6" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M587 56 L590.1 63 L583.9 63 Z" fill="currentColor" class="c-ok"/><line x1="587" y1="202" x2="587" y2="238.4" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M587 244 L583.9 237 L590.1 237 Z" fill="currentColor" class="c-ok"/><text x="607" y="90" font-size="13" text-anchor="start" fill="currentColor" class="c-acc"><tspan font-style="italic">S</tspan></text><text x="575" y="272" font-size="13.5" text-anchor="middle" font-weight="700" fill="currentColor">Plan : Φ = 2<tspan font-style="italic">E</tspan>·<tspan font-style="italic">S</tspan></text></svg><figcaption>Les trois surfaces de Gauss à connaître. Sphère (centre O) : E radial, même norme partout, Φ = E·4πr². Fil infini : cylindre de rayon r et de hauteur h, flux nul sur les deux bases, Φ = E·2πrh. Plan infini : cylindre qui traverse le plan, flux nul sur le côté, Φ = 2E·S.</figcaption></figure>
