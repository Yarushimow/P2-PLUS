.6" stroke-linejoin="round" stroke-linecap="round" class="c-acc"/><line x1="450" y1="211.2" x2="450" y2="61.7" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M450 55.2 L453.6 63.2 L446.4 63.2 Z" fill="currentColor" class="c-ok"/><line x1="470" y1="203.8" x2="470" y2="54.2" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M470 47.8 L473.6 55.8 L466.4 55.8 Z" fill="currentColor" class="c-ok"/><line x1="490" y1="196.2" x2="490" y2="46.7" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M490 40.2 L493.6 48.2 L486.4 48.2 Z" fill="currentColor" class="c-ok"/><line x1="510" y1="188.8" x2="510" y2="39.2" stroke="currentColor" stroke-width="1.8" class="c-ok"/><path d="M510 32.8 L513.6 40.8 L506.4 40.8 Z" fill="currentColor" class="c-ok"/><text x="428" y="70" font-size="15" text-anchor="middle" font-weight="700" fill="currentColor" class="c-acc"><tspan font-style="italic">S</tspan></text><line x1="480" y1="122" x2="531.5" y2="102.8" stroke="currentColor" stroke-width="2.4"/><path d="M538.3 100.3 L531.3 107.2 L528.4 99.6 Z" fill="currentColor"/><text x="544.3" y="96.3" font-size="15" text-anchor="start" fill="currentColor"><tspan font-style="italic" font-weight="700">n</tspan></text><text x="465" y="236" font-size="14" text-anchor="middle" font-weight="700" fill="currentColor"><tspan font-style="italic" font-weight="700">E</tspan> ⊥ <tspan font-style="italic" font-weight="700">n</tspan> : Φ = 0</text></svg><figcaption>Le flux mesure « combien de champ traverse » une surface, comme la pluie qui passe par une fenêtre. Champ perpendiculaire à la surface (parallèle à n) : flux maximal, Φ = E·S. Champ rasant (perpendiculaire à n) : rien ne traverse, Φ = 0.</figcaption></figure>
