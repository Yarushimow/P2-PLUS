lor" class="c-mut">Vue de côté</text><circle cx="495" cy="140" r="36" fill="none" stroke="currentColor" stroke-width="1.6" class="c-acc"/><path d="M520.5 114.5 L528.7 117.7 L523.6 122.7 Z" fill="currentColor" class="c-acc"/><path d="M469.5 165.5 L461.3 162.3 L466.4 157.3 Z" fill="currentColor" class="c-acc"/><circle cx="495" cy="140" r="66" fill="none" stroke="currentColor" stroke-width="1.6" class="c-acc"/><path d="M541.7 93.3 L549.9 96.4 L544.8 101.5 Z" fill="currentColor" class="c-acc"/><path d="M448.3 186.7 L440.1 183.6 L445.2 178.5 Z" fill="currentColor" class="c-acc"/><circle cx="495" cy="140" r="100" fill="none" stroke="currentColor" stroke-width="1.6" class="c-acc"/><path d="M565.7 69.3 L573.9 72.4 L568.8 77.5 Z" fill="currentColor" class="c-acc"/><path d="M424.3 210.7 L416.1 207.6 L421.2 202.5 Z" fill="currentColor" class="c-acc"/><circle cx="495" cy="140" r="13" fill="none" stroke="currentColor" stroke-width="2" class="c-pos"/><circle cx="495" cy="140" r="13" class="fond"/><circle cx="495" cy="140" r="13" fill="none" stroke="currentColor" stroke-width="2" class="c-pos"/><circle cx="495" cy="140" r="3.9" fill="currentColor" class="c-pos"/><line x1="495" y1="140" x2="561" y2="140" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 3" class="c-mut"/><text x="528" y="134" font-size="14" text-anchor="middle" fill="currentColor" class="c-mut"><tspan font-style="italic">r</tspan></text><text x="495" y="268" font-size="14" text-anchor="middle" font-weight="700" fill="currentColor"><tspan font-style="italic">B</tspan> = <tspan font-style="italic">μ</tspan><tspan baseline-shift="sub" font-size="75%">0</tspan><tspan font-style="italic">I</tspan> / (2π<tspan font-style="italic">r</tspan>)</text><text x="495" y="284" font-size="12.5" text-anchor="middle" fill="currentColor" class="c-mut">Vue de dessus (I vers toi ⊙)</text></svg><figcaption>Champ d'un fil infini. À gauche : les lignes de champ sont des cercles autour du fil ; le sens est donné par la main droite (pouce dans le sens de I, les doigts s'enroulent dans le sens de B) ou par un tire-bouchon. À droite, vue de dessus : B est tangent aux cercles et diminue en 1/r.</figcaption></figure>
