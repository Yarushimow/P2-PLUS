<figure class="schema"><svg viewBox="0 0 640 290" width="640" role="img" aria-label="Superposition des champs de deux plans chargés : champ nul à l'extérieur" xmlns="http://www.w3.org/2000/svg"><line x1="250" y1="20" x2="250" y2="230" stroke="currentColor" stroke-width="5" class="c-pos"/><line x1="390" y1="20" x2="390" y2="230" stroke="currentColor" stroke-width="5" class="c-neg"/><text x="250" y="252" font-size="15" text-anchor="middle" font-weight="700" fill="currentColor" class="c-pos">+<tspan font-style="italic">σ</tspan></text><text x="390" y="252" font-size="15" text-anchor="middle" font-weight="700" fill="currentColor" class="c-neg">−<tspan font-style="italic">σ</tspan></text><line x1="218" y1="55" x2="133.4" y2="55" stroke="currentColor" stroke-width="2" class="c-pos"/><path d="M127 55 L135 51.4 L135 58.6 Z" fill="currentColor" class="c-pos"/><line x1="272" y1="55" x2="361.6" y2="55" stroke="currentColor" stroke-width="2" class="c-pos"/><path d="M368 55 L360 58.6 L360 51.4 Z" fill="currentColor" class="c-pos"/><line x1="422" y1="55" x2="506.6" y2="55" stroke="currentColor" stroke-width="2" class="c-pos"/><path d="M513 55 L505 58.6 L505 51.4 Z" fill="currentColor" class="c-pos"/><text x="30" y="59" font-size="12.5" text-anchor="start" fill="currentColor" class="c-pos">plan + seul</text><line x1="127" y1="115" x2="211.6" y2="115" stroke="currentColor" stroke-width="2" class="c-neg"/><path d="M218 115 L210 118.6 L210 111.4 Z" fill="currentColor" class="c-neg"/><line x1="272" y1="115" x2="361.6" y2="115" stroke="currentColor" stroke-width="2" class="c-neg"/><path d="M368 115 L360 118.6 L360 111.4 Z" fill="currentColor" class="c-neg"/><line x1="513" y1="115" x2="428.4" y2="115" stroke="currentColor" stroke-width="2" class="c-neg"/><path d="M422 115 L430 111.4 L430 118.6 Z" fill="currentColor" class="c-neg"/><text x="30" y="119" font-size="12.5" text-anchor="start" fill="currentColor" class="c-neg">plan − seul</text><line x1="30" y1="150" x2="610" y2="150" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4" class="c-mut"/><text x="30" y="189" font-size="13" text-anchor="start" font-weight="700" fill="currentColor" class="c-ok">total</text><text x="172" y="190" font-size="17" text-anchor="middle" font-weight="700" fill="currentColor" class="c-ok">0</text><line x1="272" y1="185" x2="359.2" y2="185" stroke="currentColor" stroke-width="3.2" class="c-ok"/><path d="M368 185 L357 189.9 L357 180.1 Z" fill="currentColor" class="c-ok"/><text x="320" y="173" font-size="14" text-anchor="middle" font-weight="700" fill="currentColor" class="c-ok"><tspan font-style="italic">σ</tspan>/<tspan font-style="italic">ε</tspan><tspan baseline-shift="sub" font-size="75%">0</tspan></text><text x="468" y="190" font-size="17" text-anchor="middle" font-weight="700" fill="currentColor" class="c-ok">0</text></svg><figcaption>Pourquoi le champ est nul hors d'un condensateur : chaque plan crée σ/2ε₀ de chaque côté. Le plan + repousse (flèches qui s'éloignent), le plan − attire. Entre les plans les deux champs s'ajoutent (σ/ε₀) ; à l'extérieur ils se compensent (0).</figcaption></figure>
