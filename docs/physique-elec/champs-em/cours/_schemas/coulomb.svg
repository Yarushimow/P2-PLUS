<figure class="schema"><svg viewBox="0 0 640 220" width="640" role="img" aria-label="Répulsion entre charges de même signe et attraction entre charges de signes opposés" xmlns="http://www.w3.org/2000/svg"><text x="18" y="32" font-size="13" text-anchor="start" font-weight="700" fill="currentColor" class="c-mut">Mêmes signes : répulsion</text><line x1="230" y1="70" x2="420" y2="70" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" class="c-mut"/><circle cx="230" cy="70" r="13" fill="currentColor" class="c-pos"/><text x="230" y="75" font-size="14" text-anchor="middle" font-weight="700" class="on-charge">+</text><circle cx="420" cy="70" r="13" fill="currentColor" class="c-pos"/><text x="420" y="75" font-size="14" text-anchor="middle" font-weight="700" class="on-charge">+</text><text x="230" y="103" font-size="14" text-anchor="middle" fill="currentColor" class="c-pos"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="420" y="103" font-size="14" text-anchor="middle" fill="currentColor" class="c-pos"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="75%">2</tspan></text><line x1="435" y1="70" x2="507.8" y2="70" stroke="currentColor" stroke-width="2.4" class="c-warn"/><path d="M515 70 L506 74 L506 66 Z" fill="currentColor" class="c-warn"/><line x1="215" y1="70" x2="142.2" y2="70" stroke="currentColor" stroke-width="2.4" class="c-warn"/><path d="M135 70 L144 66 L144 74 Z" fill="currentColor" class="c-warn"/><text x="480" y="58" font-size="14" text-anchor="middle" fill="currentColor" class="c-warn"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="75%">1→2</tspan></text><text x="170" y="58" font-size="14" text-anchor="middle" fill="currentColor" class="c-warn"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="75%">2→1</tspan></text><line x1="230" y1="44" x2="272.4" y2="44" stroke="currentColor" stroke-width="1.6" class="c-acc"/><path d="M278 44 L271 47.1 L271 40.9 Z" fill="currentColor" class="c-acc"/><text x="288" y="48" font-size="13" text-anchor="start" fill="currentColor" class="c-acc"><tspan font-style="italic" font-weight="700">u</tspan><tspan baseline-shift="sub" font-size="75%">12</tspan></text><text x="325" y="100" font-size="14" text-anchor="middle" fill="currentColor" class="c-mut"><tspan font-style="italic">r</tspan></text><text x="18" y="137" font-size="13" text-anchor="start" font-weight="700" fill="currentColor" class="c-mut">Signes opposés : attraction</text><line x1="230" y1="175" x2="420" y2="175" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" class="c-mut"/><circle cx="230" cy="175" r="13" fill="currentColor" class="c-pos"/><text x="230" y="180" font-size="14" text-anchor="middle" font-weight="700" class="on-charge">+</text><circle cx="420" cy="175" r="13" fill="currentColor" class="c-neg"/><text x="420" y="180" font-size="14" text-anchor="middle" font-weight="700" class="on-charge">−</text><text x="230" y="208" font-size="14" text-anchor="middle" fill="currentColor" class="c-pos"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="75%">1</tspan></text><text x="420" y="208" font-size="14" text-anchor="middle" fill="currentColor" class="c-neg"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="75%">2</tspan></text><line x1="405" y1="175" x2="352.2" y2="175" stroke="currentColor" stroke-width="2.4" class="c-warn"/><path d="M345 175 L354 170.9 L354 179.1 Z" fill="currentColor" class="c-warn"/><line x1="245" y1="175" x2="297.8" y2="175" stroke="currentColor" stroke-width="2.4" class="c-warn"/><path d="M305 175 L296 179.1 L296 170.9 Z" fill="currentColor" class="c-warn"/><text x="375" y="163" font-size="14" text-anchor="middle" fill="currentColor" class="c-warn"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="75%">1→2</tspan></text><text x="275" y="163" font-size="14" text-anchor="middle" fill="currentColor" class="c-warn"><tspan font-style="italic" font-weight="700">F</tspan><tspan baseline-shift="sub" font-size="75%">2→1</tspan></text><text x="555" y="128" font-size="14.5" text-anchor="middle" font-weight="700" fill="currentColor"><tspan font-style="italic">F</tspan> = <tspan font-style="italic">k</tspan><tspan baseline-shift="sub" font-size="75%">e</tspan>|<tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="75%">1</tspan><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="75%">2</tspan>|/<tspan font-style="italic">r</tspan><tspan baseline-shift="super" font-size="70%">2</tspan></text></svg><figcaption>Loi de Coulomb : la force est portée par la droite qui joint les charges. Mêmes signes : elles se repoussent ; signes opposés : elles s'attirent. Les deux forces sont opposées (3ᵉ loi de Newton).</figcaption></figure>
