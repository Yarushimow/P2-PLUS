<figure class="schema"><svg viewBox="0 0 640 290" width="640" role="img" aria-label="Carte du chapitre : champ, force, potentiel, énergie potentielle et leurs liens" xmlns="http://www.w3.org/2000/svg"><text x="225" y="26" font-size="13" text-anchor="middle" fill="currentColor" class="c-mut">créé par les charges sources</text><text x="515" y="26" font-size="13" text-anchor="middle" fill="currentColor" class="c-mut">subi par une charge Q</text><text x="18" y="95" font-size="12" text-anchor="start" font-weight="700" fill="currentColor" class="c-mut">VECTEURS</text><text x="18" y="230" font-size="12" text-anchor="start" font-weight="700" fill="currentColor" class="c-mut">SCALAIRES</text><rect x="150" y="60" width="150" height="62" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8" class="c-acc"/><text x="225" y="88" font-size="17" text-anchor="middle" font-weight="700" fill="currentColor" class="c-acc">Champ <tspan font-style="italic" font-weight="700">E</tspan></text><text x="225" y="108" font-size="12.5" text-anchor="middle" fill="currentColor" class="c-mut">en V/m</text><rect x="440" y="60" width="150" height="62" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8" class="c-warn"/><text x="515" y="88" font-size="17" text-anchor="middle" font-weight="700" fill="currentColor" class="c-warn">Force <tspan font-style="italic" font-weight="700">F</tspan></text><text x="515" y="108" font-size="12.5" text-anchor="middle" fill="currentColor" class="c-mut">en N</text><rect x="150" y="195" width="150" height="62" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8" class="c-acc"/><text x="225" y="223" font-size="17" text-anchor="middle" font-weight="700" fill="currentColor" class="c-acc">Potentiel <tspan font-style="italic">V</tspan></text><text x="225" y="243" font-size="12.5" text-anchor="middle" fill="currentColor" class="c-mut">en V</text><rect x="440" y="195" width="150" height="62" rx="10" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.8" class="c-warn"/><text x="515" y="223" font-size="17" text-anchor="middle" font-weight="700" fill="currentColor" class="c-warn">Énergie <tspan font-style="italic">E</tspan><tspan baseline-shift="sub" font-size="75%">p</tspan></text><text x="515" y="243" font-size="12.5" text-anchor="middle" fill="currentColor" class="c-mut">en J</text><line x1="302" y1="91" x2="428.8" y2="91" stroke="currentColor" stroke-width="2"/><path d="M436 91 L427 95 L427 87 Z" fill="currentColor"/><text x="369" y="82" font-size="15" text-anchor="middle" font-weight="700" fill="currentColor">× <tspan font-style="italic">Q</tspan></text><line x1="302" y1="226" x2="428.8" y2="226" stroke="currentColor" stroke-width="2"/><path d="M436 226 L427 230.1 L427 221.9 Z" fill="currentColor"/><text x="369" y="217" font-size="15" text-anchor="middle" font-weight="700" fill="currentColor">× <tspan font-style="italic">Q</tspan></text><text x="369" y="113" font-size="13" text-anchor="middle" fill="currentColor" class="c-mut"><tspan font-style="italic" font-weight="700">F</tspan> = <tspan font-style="italic">Q</tspan><tspan font-style="italic" font-weight="700">E</tspan></text><text x="369" y="248" font-size="13" text-anchor="middle" fill="currentColor" class="c-mut"><tspan font-style="italic">E</tspan><tspan baseline-shift="sub" font-size="75%">p</tspan> = <tspan font-style="italic">Q</tspan><tspan font-style="italic">V</tspan></text><line x1="200" y1="190" x2="200" y2="133.2" stroke="currentColor" stroke-width="2" class="c-ok"/><path d="M200 126 L204.1 135 L195.9 135 Z" fill="currentColor" class="c-ok"/><line x1="250" y1="126" x2="250" y2="182.8" stroke="currentColor" stroke-width="2" class="c-ok"/><path d="M250 190 L245.9 181 L254.1 181 Z" fill="currentColor" class="c-ok"/><text x="193" y="163" font-size="13" text-anchor="end" fill="currentColor" class="c-ok"><tspan font-style="italic" font-weight="700">E</tspan> = −grad <tspan font-style="italic">V</tspan></text><text x="258" y="163" font-size="13" text-anchor="start" fill="currentColor" class="c-ok">∫<tspan font-style="italic" font-weight="700">E</tspan>·d<tspan font-style="italic" font-weight="700">l</tspan> = <tspan font-style="italic">V</tspan>(<tspan font-style="italic">A</tspan>) − <tspan font-style="italic">V</tspan>(<tspan font-style="italic">B</tspan>)</text></svg><figcaption>Les quatre grandeurs du chapitre. À gauche, ce que créent les charges sources (même sans personne pour le subir) ; à droite, ce que subit une charge Q placée là. On passe d'une colonne à l'autre en multipliant par Q.</figcaption></figure>
