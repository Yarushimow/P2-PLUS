<figure class="schema"><svg viewBox="0 0 600 230" width="600" role="img" aria-label="Boussole sous un fil, sans puis avec courant" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="105" r="44" fill="none" stroke="currentColor" stroke-width="1.5" class="c-mut"/><path d="M150 67 L157 105 L143 105 Z" fill="currentColor" stroke="none" stroke-linejoin="round" stroke-linecap="round" class="c-warn"/><path d="M150 143 L157 105 L143 105 Z" fill="currentColor" stroke="none" stroke-linejoin="round" stroke-linecap="round" class="c-mut"/><circle cx="150" cy="105" r="3" fill="currentColor"/><text x="150" y="57" font-size="12" text-anchor="middle" font-weight="700" fill="currentColor" class="c-warn">N</text><rect x="144" y="22" width="12" height="170" rx="3" fill="currentColor" fill-opacity="0.15"/><line x1="150" y1="22" x2="150" y2="192" stroke="currentColor" stroke-width="1.2" class="c-mut"/><text x="150" y="220" font-size="14" text-anchor="middle" font-weight="700" fill="currentColor"><tspan font-style="italic">I</tspan> = 0</text><circle cx="450" cy="105" r="44" fill="none" stroke="currentColor" stroke-width="1.5" class="c-mut"/><path d="M412 105 L450 98 L450 112 Z" fill="currentColor" stroke="none" stroke-linejoin="round" stroke-linecap="round" class="c-warn"/><path d="M488 105 L450 98 L450 112 Z" fill="currentColor" stroke="none" stroke-linejoin="round" stroke-linecap="round" class="c-mut"/><circle cx="450" cy="105" r="3" fill="currentColor"/><text x="398" y="109" font-size="12" text-anchor="middle" font-weight="700" fill="currentColor" class="c-warn">N</text><rect x="444" y="22" width="12" height="170" rx="3" fill="currentColor" fill-opacity="0.15"/><line x1="450" y1="22" x2="450" y2="192" stroke="currentColor" stroke-width="1.2" class="c-mut"/><line x1="468" y1="175" x2="468" y2="141.4" stroke="currentColor" stroke-width="2.2" class="c-pos"/><path d="M468 135 L471.6 143 L464.4 143 Z" fill="currentColor" class="c-pos"/><text x="476" y="165" font-size="14" text-anchor="start" font-weight="700" fill="currentColor" class="c-pos"><tspan font-style="italic">I</tspan></text><line x1="380" y1="40" x2="336.4" y2="40" stroke="currentColor" stroke-width="2" class="c-acc"/><path d="M330 40 L338 36.4 L338 43.6 Z" fill="currentColor" class="c-acc"/><text x="355" y="30" font-size="13" text-anchor="middle" fill="currentColor" class="c-acc"><tspan font-style="italic" font-weight="700">B</tspan> sous le fil</text><text x="450" y="220" font-size="14" text-anchor="middle" font-weight="700" fill="currentColor"><tspan font-style="italic">I</tspan> ≠ 0</text><text x="40" y="30" font-size="12" text-anchor="start" fill="currentColor" class="c-mut">nord ↑</text></svg><figcaption>Expérience d'Oersted (vue de dessus, fil au-dessus de la boussole). Sans courant, la boussole indique le nord, le long du fil. Avec un courant dirigé vers le nord, elle tourne vers l'ouest et se place perpendiculairement au fil (si le courant est assez fort) : le courant crée un champ magnétique. Si on inverse I, elle tourne dans l'autre sens.</figcaption></figure>
